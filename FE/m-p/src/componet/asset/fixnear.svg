<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
  <title id="title">FixNear logo</title>
  <desc id="desc">Orange house-shaped location pin with a white wrench, followed by the FixNear wordmark and tagline.</desc>
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#FF5A00"/>
    </linearGradient>
  </defs>
  <!-- House/location mark -->
  <g transform="translate(22 25)">
    <path d="M18 83 L91 24 Q101 16 111 24 L184 83 Q193 90 186 99 Q180 107 171 100 L101 44 L31 100 Q22 107 15 98 Q8 90 18 83Z" fill="url(#orange)"/>
    <path d="M53 83 L101 48 L149 83 L149 133 Q149 148 134 148 L68 148 Q53 148 53 133Z" fill="url(#orange)"/>
    <path d="M75 103
             C68 91 73 76 85 70
             C94 65 104 66 112 72
             L101 83 L104 94 L115 97 L126 86
             C132 99 128 114 116 121
             C106 127 94 126 86 119
             L66 141 L54 129 Z"
          fill="#FFFFFF" transform="translate(10 -2) scale(.95)"/>
    <rect x="130" y="39" width="23" height="43" rx="6" fill="url(#orange)"/>
    <ellipse cx="101" cy="171" rx="53" ry="5" fill="#FFB16B" opacity=".8"/>
  </g>
  <!-- Wordmark -->
  <text x="235" y="126" font-family="Inter, Arial, Helvetica, sans-serif" font-size="82" font-weight="800" letter-spacing="-3">
    <tspan fill="#17232E">Fix</tspan><tspan fill="#FF6900">Near</tspan>
  </text>
  <text x="239" y="166" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="400" letter-spacing=".4" fill="#26323D">Local Services. Trusted Experts.</text>
</svg>
